<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#124e43">
    <title>Sedang offline — Quran Web</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f6f1;
        color: #173d35;
        font: 16px/1.6 Arial, Helvetica, sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid #e8e4d9;
        border-radius: 28px;
        background: #fff;
        text-align: center;
      }
      img { width: 72px; height: 72px; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0; color: #748179; }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 20px;
        border-radius: 999px;
        background: #124e43;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="">
      <h1>Kamu sedang offline</h1>
      <p>Beberapa fitur memerlukan koneksi internet. Periksa jaringanmu, lalu coba buka Quran Web lagi.</p>
      <a href="/">Coba lagi</a>
    </main>
  </body>
</html>
